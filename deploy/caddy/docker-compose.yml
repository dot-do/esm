# =============================================================================
# Docker Compose for esm.do with Caddy Reverse Proxy
# Production-ready setup with automatic HTTPS, compression, and rate limiting
# =============================================================================

version: "3.8"

services:
  # ===========================================================================
  # Caddy - Reverse Proxy with Automatic HTTPS
  # ===========================================================================
  caddy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: esm-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3
    environment:
      - ACME_EMAIL=${ACME_EMAIL:-admin@esm.do}
      - CADDY_ADMIN=off
    volumes:
      # Caddyfile configuration
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Persistent storage for certificates and data
      - caddy-data:/data
      - caddy-config:/config
      # Logs directory
      - caddy-logs:/var/log/caddy
    networks:
      - esm-network
    depends_on:
      esm-do:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    # Cap add for binding to privileged ports
    cap_add:
      - NET_BIND_SERVICE
    # Security options
    security_opt:
      - no-new-privileges:true
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M

  # ===========================================================================
  # esm.do Worker - Main Application
  # ===========================================================================
  esm-do:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    container_name: esm-do-worker
    restart: unless-stopped
    # Internal port only - not exposed externally
    expose:
      - "8787"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    networks:
      - esm-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8787/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    # Security options
    security_opt:
      - no-new-privileges:true
    # Read-only root filesystem
    read_only: true
    # Temporary filesystem for runtime
    tmpfs:
      - /tmp:noexec,nosuid,size=100M
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 256M

  # ===========================================================================
  # Redis - Caching (Optional)
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: esm-redis
    restart: unless-stopped
    expose:
      - "6379"
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - esm-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 300M
        reservations:
          cpus: "0.1"
          memory: 64M
    profiles:
      - with-cache

# =============================================================================
# Networks
# =============================================================================
networks:
  esm-network:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_icc: "true"
      com.docker.network.bridge.enable_ip_masquerade: "true"
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16

# =============================================================================
# Volumes
# =============================================================================
volumes:
  # Caddy volumes
  caddy-data:
    driver: local
  caddy-config:
    driver: local
  caddy-logs:
    driver: local
  # Redis volume
  redis-data:
    driver: local
