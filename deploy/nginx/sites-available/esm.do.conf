# esm.do site configuration
# Nginx reverse proxy for esm.do ESM CDN service

# HTTP to HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name esm.do *.esm.do;

    # ACME challenge for Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# Main HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name esm.do *.esm.do;

    # SSL certificates
    ssl_certificate /etc/nginx/ssl/esm.do.crt;
    ssl_certificate_key /etc/nginx/ssl/esm.do.key;
    ssl_trusted_certificate /etc/nginx/ssl/esm.do.chain.crt;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

    # HSTS (enable after confirming SSL works)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # CORS headers for ESM modules
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept, Range" always;
    add_header Access-Control-Expose-Headers "Content-Length, Content-Range, X-TypeScript-Types" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;

    # Timing headers
    add_header Timing-Allow-Origin "*" always;

    # Connection limits
    limit_conn conn_limit 50;

    # Health check endpoint (no rate limiting)
    location = /health {
        proxy_pass http://esm_worker;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }

    # Favicon - cache indefinitely
    location = /favicon.ico {
        proxy_pass http://esm_worker;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_cache esm_cache;
        proxy_cache_valid 200 30d;
        proxy_cache_valid 404 1m;
        add_header X-Cache-Status $upstream_cache_status;
        expires 30d;
    }

    # Static assets - aggressive caching
    location ~* ^/(?:robots\.txt|sitemap\.xml)$ {
        proxy_pass http://esm_worker;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_cache esm_cache;
        proxy_cache_valid 200 1d;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # ESM modules - long cache with versioning
    # Matches: /package@version/path.js
    location ~* ^/[^@]+@[^/]+/ {
        limit_req zone=api burst=50 nodelay;

        proxy_pass http://esm_worker;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Caching for versioned packages (immutable)
        proxy_cache esm_cache;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_valid 200 365d;
        proxy_cache_valid 301 302 1h;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;

        add_header X-Cache-Status $upstream_cache_status always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;
    }

    # Unversioned package requests - shorter cache
    # Matches: /package or /package/path
    location ~* ^/[^@/]+(?:/[^@]*)?$ {
        limit_req zone=api burst=30 nodelay;

        proxy_pass http://esm_worker;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Shorter cache for unversioned (resolves to latest)
        proxy_cache esm_cache;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_valid 200 5m;
        proxy_cache_valid 301 302 1m;
        proxy_cache_valid 404 30s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;

        add_header X-Cache-Status $upstream_cache_status always;
        add_header Cache-Control "public, max-age=300" always;

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;
    }

    # API endpoints
    location ~* ^/api/ {
        limit_req zone=api burst=20 nodelay;

        proxy_pass http://esm_worker;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Minimal caching for API
        proxy_cache esm_cache;
        proxy_cache_valid 200 1m;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # Default location - general rate limiting
    location / {
        limit_req zone=general burst=20 nodelay;

        proxy_pass http://esm_worker;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Default caching
        proxy_cache esm_cache;
        proxy_cache_valid 200 5m;
        proxy_cache_valid 301 302 1m;
        proxy_cache_valid 404 30s;
        add_header X-Cache-Status $upstream_cache_status always;

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Error pages
    error_page 429 /429.html;
    error_page 500 502 503 504 /50x.html;

    location = /429.html {
        internal;
        default_type application/json;
        return 429 '{"error":"Too Many Requests","message":"Rate limit exceeded. Please slow down."}';
    }

    location = /50x.html {
        internal;
        default_type application/json;
        return 500 '{"error":"Server Error","message":"The server encountered an error. Please try again."}';
    }
}
