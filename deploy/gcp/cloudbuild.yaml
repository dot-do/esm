# Cloud Build configuration for esm.do
# Builds Docker image and deploys to Cloud Run
#
# Required substitutions:
#   _REGION: GCP region (e.g., us-central1)
#   _SERVICE_NAME: Cloud Run service name (default: esm-do)
#   _ARTIFACT_REGISTRY: Artifact Registry repository (e.g., us-central1-docker.pkg.dev/PROJECT_ID/esm-do)
#
# Usage:
#   gcloud builds submit --config=deploy/gcp/cloudbuild.yaml \
#     --substitutions=_REGION=us-central1,_SERVICE_NAME=esm-do

substitutions:
  _REGION: us-central1
  _SERVICE_NAME: esm-do
  _MAX_INSTANCES: "10"
  _MIN_INSTANCES: "0"
  _MEMORY: "512Mi"
  _CPU: "1"
  _CONCURRENCY: "80"
  _TIMEOUT: "300s"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  # Step 1: Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_SERVICE_NAME}/${_SERVICE_NAME}:${SHORT_SHA}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_SERVICE_NAME}/${_SERVICE_NAME}:latest'
      - '-f'
      - 'deploy/gcp/Dockerfile'
      - '.'

  # Step 2: Push image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_SERVICE_NAME}/${_SERVICE_NAME}'
    waitFor: ['build']

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_SERVICE_NAME}/${_SERVICE_NAME}:${SHORT_SHA}'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '${_MEMORY}'
      - '--cpu'
      - '${_CPU}'
      - '--min-instances'
      - '${_MIN_INSTANCES}'
      - '--max-instances'
      - '${_MAX_INSTANCES}'
      - '--concurrency'
      - '${_CONCURRENCY}'
      - '--timeout'
      - '${_TIMEOUT}'
      - '--set-env-vars'
      - 'NODE_ENV=production'
      - '--labels'
      - 'app=esm-do,managed-by=cloud-build'
    waitFor: ['push']

# Images to be pushed to Artifact Registry
images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_SERVICE_NAME}/${_SERVICE_NAME}:${SHORT_SHA}'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_SERVICE_NAME}/${_SERVICE_NAME}:latest'

# Build timeout (10 minutes)
timeout: 600s
