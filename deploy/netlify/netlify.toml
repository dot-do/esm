# Netlify configuration for esm.do Edge Functions deployment
# https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  # Build command - compile TypeScript
  command = "npm run build"
  # Directory containing the built site (static assets)
  publish = "public"
  # Edge functions directory
  edge_functions = "netlify/edge-functions"

[build.environment]
  NODE_VERSION = "20"
  NPM_VERSION = "10"

# Development settings
[dev]
  command = "npm run dev"
  port = 8888
  targetPort = 8787

# Edge function configuration
[[edge_functions]]
  path = "/*"
  function = "esm"

# Headers for all responses
[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, DELETE, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization, Accept"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache headers for versioned assets (immutable)
[[headers]]
  for = "/*@*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache headers for module files
[[headers]]
  for = "/*.mjs"
  [headers.values]
    Cache-Control = "public, max-age=300"
    Content-Type = "application/javascript"

# Cache headers for TypeScript declaration files
[[headers]]
  for = "/*.d.ts"
  [headers.values]
    Cache-Control = "public, max-age=300"
    Content-Type = "application/typescript"

# Redirects - all traffic goes to edge function
[[redirects]]
  from = "/*"
  to = "/.netlify/edge-functions/esm"
  status = 200
  force = true

# Environment variables (set in Netlify dashboard for secrets)
# ESM_API_KEY - API authentication key
# ESM_STORAGE_KEY - Storage encryption key
# ESM_AUTH_TOKEN - Auth token for protected namespaces
