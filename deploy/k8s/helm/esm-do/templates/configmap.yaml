apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "esm-do.configMapName" . }}
  labels:
    {{- include "esm-do.labels" . | nindent 4 }}
data:
  # Logging configuration
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}

  # Development mode
  DEV_MODE: {{ .Values.config.devMode | quote }}

  # Request configuration
  MAX_BODY_SIZE: {{ .Values.config.maxBodySize | quote }}
  REQUEST_TIMEOUT: {{ .Values.config.requestTimeout | quote }}

  # Metrics configuration
  METRICS_ENABLED: {{ .Values.config.metricsEnabled | quote }}
  METRICS_PORT: {{ .Values.config.metricsPort | quote }}

  # CORS configuration
  CORS_ENABLED: {{ .Values.config.corsEnabled | quote }}
  CORS_ORIGINS: {{ .Values.config.corsOrigins | quote }}

  # Node.js compatibility
  NODEJS_COMPAT: {{ .Values.config.nodejsCompat | quote }}

  # Workerd configuration
  WORKERD_PORT: {{ .Values.service.targetPort | quote }}
