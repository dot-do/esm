{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "esm-do.fullname" . }}
  labels:
    {{- include "esm-do.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $key, $value := .Values.secrets.values }}
  {{ $key }}: {{ $value | b64enc | quote }}
  {{- end }}
---
{{- end }}
{{/*
Example secret template for manual creation:

To create secrets manually, apply this template with your values:

apiVersion: v1
kind: Secret
metadata:
  name: {{ include "esm-do.fullname" . }}-manual
  labels:
    {{- include "esm-do.labels" . | nindent 4 }}
type: Opaque
stringData:
  API_KEY: "your-api-key"
  DATABASE_URL: "postgresql://user:pass@host:5432/db"
  CLOUDFLARE_API_TOKEN: "your-cf-token"

Then reference it in values.yaml:
secrets:
  existingSecret: "{{ include "esm-do.fullname" . }}-manual"
*/}}
