# Default values for esm-do
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# -- Number of replicas for the deployment
replicaCount: 2

image:
  # -- Container image repository
  repository: ghcr.io/dot-do/esm
  # -- Image pull policy
  pullPolicy: IfNotPresent
  # -- Overrides the image tag (defaults to Chart appVersion)
  tag: ""

# -- Image pull secrets for private registries
imagePullSecrets: []

# -- Override the chart name
nameOverride: ""

# -- Override the full release name
fullnameOverride: ""

serviceAccount:
  # -- Specifies whether a service account should be created
  create: true
  # -- Automatically mount a ServiceAccount's API credentials
  automount: true
  # -- Annotations to add to the service account
  annotations: {}
  # -- The name of the service account to use
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# -- Annotations to add to the pod
podAnnotations: {}

# -- Labels to add to the pod
podLabels: {}

# -- Pod security context
podSecurityContext:
  fsGroup: 1000
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000

# -- Container security context
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000
  seccompProfile:
    type: RuntimeDefault

service:
  # -- Kubernetes service type
  type: ClusterIP
  # -- Service port
  port: 80
  # -- Target port on the container (workerd default)
  targetPort: 8787
  # -- Node port (only used when type is NodePort or LoadBalancer)
  nodePort: ""
  # -- Load balancer IP (only used when type is LoadBalancer)
  loadBalancerIP: ""
  # -- Load balancer source ranges
  loadBalancerSourceRanges: []
  # -- External traffic policy (Cluster or Local)
  externalTrafficPolicy: ""
  # -- Additional service annotations
  annotations: {}

ingress:
  # -- Enable ingress
  enabled: false
  # -- Ingress class name
  className: "nginx"
  # -- Ingress annotations
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  # -- Ingress hosts configuration
  hosts:
    - host: esm.do
      paths:
        - path: /
          pathType: Prefix
  # -- Ingress TLS configuration
  tls: []
  #  - secretName: esm-do-tls
  #    hosts:
  #      - esm.do

# -- Resource requests and limits
resources:
  limits:
    cpu: 1000m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

# -- Liveness probe configuration
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 3
  successThreshold: 1

# -- Readiness probe configuration
readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3
  successThreshold: 1

# -- Startup probe configuration (for slow-starting containers)
startupProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 30
  successThreshold: 1

autoscaling:
  # -- Enable horizontal pod autoscaling
  enabled: true
  # -- Minimum number of replicas
  minReplicas: 2
  # -- Maximum number of replicas
  maxReplicas: 10
  # -- Target CPU utilization percentage
  targetCPUUtilizationPercentage: 70
  # -- Target memory utilization percentage
  targetMemoryUtilizationPercentage: 80
  # -- Custom metrics for scaling
  customMetrics: []
  # -- Scaling behavior configuration
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
      selectPolicy: Max

# -- Additional volumes for the pod
volumes: []

# -- Additional volume mounts for the container
volumeMounts: []

# -- Node selector for pod scheduling
nodeSelector: {}

# -- Tolerations for pod scheduling
tolerations: []

# -- Affinity rules for pod scheduling
affinity: {}

# -- Topology spread constraints
topologySpreadConstraints: []

# -- Pod disruption budget configuration
podDisruptionBudget:
  enabled: true
  minAvailable: 1
  # maxUnavailable: 1

# -- Additional environment variables
env: []
  # - name: LOG_LEVEL
  #   value: "info"

# -- Environment variables from secrets or configmaps
envFrom: []
  # - secretRef:
  #     name: esm-do-secrets
  # - configMapRef:
  #     name: esm-do-config

# Configuration for the esm-do application
config:
  # -- Log level (debug, info, warn, error)
  logLevel: "info"
  # -- Enable development mode
  devMode: false
  # -- Maximum request body size
  maxBodySize: "10mb"
  # -- Request timeout in milliseconds
  requestTimeout: 30000
  # -- Enable metrics endpoint
  metricsEnabled: true
  # -- Metrics port
  metricsPort: 9090
  # -- Enable CORS
  corsEnabled: true
  # -- CORS allowed origins (comma-separated)
  corsOrigins: "*"
  # -- Node.js compatibility mode
  nodejsCompat: true

# Secrets configuration
secrets:
  # -- Create secrets from values
  create: false
  # -- Name of existing secret to use
  existingSecret: ""
  # -- Secret values (only used if create is true)
  values: {}
    # API_KEY: ""
    # DATABASE_URL: ""

# -- Extra init containers
initContainers: []

# -- Extra containers (sidecars)
extraContainers: []

# -- Lifecycle hooks
lifecycle: {}
  # preStop:
  #   exec:
  #     command: ["/bin/sh", "-c", "sleep 10"]

# -- Priority class name
priorityClassName: ""

# -- Runtime class name
runtimeClassName: ""

# -- Termination grace period in seconds
terminationGracePeriodSeconds: 30

# -- DNS policy
dnsPolicy: ClusterFirst

# -- DNS config
dnsConfig: {}

# Network policy configuration
networkPolicy:
  # -- Enable network policy
  enabled: false
  # -- Ingress rules
  ingress: []
  # -- Egress rules
  egress: []
