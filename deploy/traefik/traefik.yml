# Traefik Static Configuration for esm.do
# This file configures the core Traefik behavior and providers

# Global settings
global:
  checkNewVersion: true
  sendAnonymousUsage: false

# API and Dashboard configuration
api:
  dashboard: true
  insecure: false  # Dashboard only accessible via authenticated route

# Logging configuration
log:
  level: INFO
  format: json

accessLog:
  format: json
  filters:
    statusCodes:
      - "200-299"
      - "400-599"
  fields:
    defaultMode: keep
    names:
      ClientUsername: drop
    headers:
      defaultMode: keep
      names:
        User-Agent: keep
        Authorization: redact
        Content-Type: keep

# Entrypoints definition
entryPoints:
  # HTTP entrypoint - redirects to HTTPS
  http:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: https
          scheme: https
          permanent: true

  # HTTPS entrypoint - main traffic
  https:
    address: ":443"
    http:
      tls:
        certResolver: letsencrypt
        domains:
          - main: esm.do
            sans:
              - "*.esm.do"
    # Connection limits
    transport:
      respondingTimeouts:
        readTimeout: 60s
        writeTimeout: 60s
        idleTimeout: 180s
      lifeCycle:
        requestAcceptGraceTimeout: 10s
        graceTimeOut: 30s

  # Metrics entrypoint (internal)
  metrics:
    address: ":8082"

# Certificate resolvers for automatic TLS
certificatesResolvers:
  letsencrypt:
    acme:
      email: admin@esm.do
      storage: /letsencrypt/acme.json
      # Use staging for testing, production for live
      # caServer: https://acme-staging-v02.api.letsencrypt.org/directory
      caServer: https://acme-v02.api.letsencrypt.org/directory
      httpChallenge:
        entryPoint: http
      # DNS challenge for wildcard certs (optional)
      # dnsChallenge:
      #   provider: cloudflare
      #   delayBeforeCheck: 10s

  letsencrypt-staging:
    acme:
      email: admin@esm.do
      storage: /letsencrypt/acme-staging.json
      caServer: https://acme-staging-v02.api.letsencrypt.org/directory
      httpChallenge:
        entryPoint: http

# Providers configuration
providers:
  # Docker provider for automatic service discovery
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: traefik-network
    watch: true
    defaultRule: "Host(`{{ normalize .Name }}.esm.do`)"

  # File provider for dynamic configuration
  file:
    directory: /etc/traefik/dynamic
    watch: true

# Metrics configuration (Prometheus)
metrics:
  prometheus:
    entryPoint: metrics
    addEntryPointsLabels: true
    addRoutersLabels: true
    addServicesLabels: true
    buckets:
      - 0.1
      - 0.3
      - 1.2
      - 5.0

# Ping endpoint for health checks
ping:
  entryPoint: https

# Server transport configuration
serversTransport:
  insecureSkipVerify: false
  maxIdleConnsPerHost: 100
  forwardingTimeouts:
    dialTimeout: 30s
    responseHeaderTimeout: 30s
    idleConnTimeout: 90s
