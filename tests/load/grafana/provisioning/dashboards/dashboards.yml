# Grafana dashboard provisioning
apiVersion: 1

providers:
  - name: 'k6 Load Testing'
    orgId: 1
    folder: 'Load Testing'
    folderUid: 'load-testing'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
