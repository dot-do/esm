# Docker Compose for esm.do Load Testing Infrastructure
#
# This configuration provides:
# - k6 load testing container
# - InfluxDB for metrics storage
# - Grafana for visualization
#
# Usage:
#   docker-compose up -d influxdb grafana     # Start metrics infrastructure
#   docker-compose run k6 run /scripts/api.js # Run k6 tests
#   docker-compose down                       # Stop all services
#
# Access:
#   Grafana: http://localhost:3000 (admin/admin)
#   InfluxDB: http://localhost:8086

version: '3.8'

services:
  # InfluxDB for storing k6 metrics
  influxdb:
    image: influxdb:1.8
    container_name: esm-load-influxdb
    ports:
      - "8086:8086"
    environment:
      - INFLUXDB_DB=k6
      - INFLUXDB_HTTP_AUTH_ENABLED=false
      - INFLUXDB_ADMIN_USER=admin
      - INFLUXDB_ADMIN_PASSWORD=admin123
    volumes:
      - influxdb-data:/var/lib/influxdb
    networks:
      - load-testing
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Grafana for metrics visualization
  grafana:
    image: grafana/grafana:latest
    container_name: esm-load-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - load-testing
    depends_on:
      influxdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # k6 load testing
  k6:
    image: grafana/k6:latest
    container_name: esm-load-k6
    volumes:
      - ./k6:/scripts
      - ./results:/results
    environment:
      - K6_OUT=influxdb=http://influxdb:8086/k6
      - BASE_URL=${BASE_URL:-http://host.docker.internal:8787}
    networks:
      - load-testing
    depends_on:
      influxdb:
        condition: service_healthy
    # Default command - can be overridden
    command: run /scripts/api.js

  # k6 with specific scenarios
  k6-smoke:
    image: grafana/k6:latest
    container_name: esm-load-k6-smoke
    volumes:
      - ./k6:/scripts
      - ./results:/results
    environment:
      - K6_OUT=influxdb=http://influxdb:8086/k6
      - BASE_URL=${BASE_URL:-http://host.docker.internal:8787}
      - SCENARIO=smoke
    networks:
      - load-testing
    depends_on:
      influxdb:
        condition: service_healthy
    profiles:
      - smoke
    command: run /scripts/scenarios.js

  k6-load:
    image: grafana/k6:latest
    container_name: esm-load-k6-load
    volumes:
      - ./k6:/scripts
      - ./results:/results
    environment:
      - K6_OUT=influxdb=http://influxdb:8086/k6
      - BASE_URL=${BASE_URL:-http://host.docker.internal:8787}
      - SCENARIO=load
    networks:
      - load-testing
    depends_on:
      influxdb:
        condition: service_healthy
    profiles:
      - load
    command: run /scripts/scenarios.js

  k6-stress:
    image: grafana/k6:latest
    container_name: esm-load-k6-stress
    volumes:
      - ./k6:/scripts
      - ./results:/results
    environment:
      - K6_OUT=influxdb=http://influxdb:8086/k6
      - BASE_URL=${BASE_URL:-http://host.docker.internal:8787}
      - SCENARIO=stress
    networks:
      - load-testing
    depends_on:
      influxdb:
        condition: service_healthy
    profiles:
      - stress
    command: run /scripts/scenarios.js

  k6-spike:
    image: grafana/k6:latest
    container_name: esm-load-k6-spike
    volumes:
      - ./k6:/scripts
      - ./results:/results
    environment:
      - K6_OUT=influxdb=http://influxdb:8086/k6
      - BASE_URL=${BASE_URL:-http://host.docker.internal:8787}
      - SCENARIO=spike
    networks:
      - load-testing
    depends_on:
      influxdb:
        condition: service_healthy
    profiles:
      - spike
    command: run /scripts/scenarios.js

  # Artillery load testing
  artillery:
    image: artilleryio/artillery:latest
    container_name: esm-load-artillery
    volumes:
      - ./artillery:/scripts
      - ./results:/results
    environment:
      - BASE_URL=${BASE_URL:-http://host.docker.internal:8787}
    networks:
      - load-testing
    profiles:
      - artillery
    working_dir: /scripts
    command: run config.yml --output /results/artillery-report.json

  # Report generator for Artillery
  artillery-report:
    image: artilleryio/artillery:latest
    container_name: esm-load-artillery-report
    volumes:
      - ./results:/results
    profiles:
      - report
    command: report /results/artillery-report.json --output /results/artillery-report.html

networks:
  load-testing:
    driver: bridge

volumes:
  influxdb-data:
    driver: local
  grafana-data:
    driver: local
